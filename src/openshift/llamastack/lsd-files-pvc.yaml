apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agentic-patching-llsd-files
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  # Use cluster default StorageClass (gp3-csi on OpenTLC sandboxes).
  # Do not hardcode ocs-* — many clusters do not have OpenShift Data Foundation.
  volumeMode: Filesystem
