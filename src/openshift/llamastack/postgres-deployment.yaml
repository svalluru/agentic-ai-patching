apiVersion: apps/v1
kind: Deployment
metadata:
  name: llamastack-postgres
  labels:
    app: llamastack-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llamastack-postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: llamastack-postgres
    spec:
      containers:
        - name: postgres
          image: registry.redhat.io/rhel9/postgresql-16:latest
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRESQL_DATABASE
              value: llamastack
            - name: POSTGRESQL_USER
              value: llamastack
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: llamastack-postgres-secret
                  key: password
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
          # Match sclorg postgresql-persistent-template (check-container, not check-postgresql)
          readinessProbe:
            exec:
              command:
                - /usr/libexec/check-container
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - /usr/libexec/check-container
                - --live
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: llamastack-postgres-data
