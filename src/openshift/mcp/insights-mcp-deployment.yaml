apiVersion: apps/v1
kind: Deployment
metadata:
  name: insights-mcp
  labels:
    app: insights-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: insights-mcp
  template:
    metadata:
      labels:
        app: insights-mcp
    spec:
      containers:
        - name: insights-mcp
          image: ghcr.io/redhatinsights/red-hat-lightspeed-mcp:latest
          args:
            - --all-tools
            - http
            - --host
            - "0.0.0.0"
          ports:
            - containerPort: 8000
          env:
            - name: LIGHTSPEED_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: agentic-patching-app-secret
                  key: LIGHTSPEED_CLIENT_ID
            - name: LIGHTSPEED_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: agentic-patching-app-secret
                  key: LIGHTSPEED_CLIENT_SECRET
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
