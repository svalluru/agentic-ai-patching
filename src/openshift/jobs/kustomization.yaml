apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configMapGenerator:
  - name: rag-ingest-scripts
    files:
      - ingest.sh
      - gpt-ingest-rhoai.py
      - reindex.sh
      - reindex-from-store.py

generatorOptions:
  disableNameSuffixHash: true

# Job manifests are applied manually (Jobs are immutable — delete before re-apply):
#   oc delete job rag-ingest rag-reindex -n agentic-patching --ignore-not-found
#   oc apply -f openshift/jobs/rag-ingest-job.yaml -n agentic-patching
